services:
  proxy:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - ADMIN_SECRET=change-me
      - CG_ALLOWED_ORIGINS=http://localhost:3000
      - CG_ENABLE_CACHE=true
      # Set to real values to enable the GA4 vendor adapter.
      - GA4_MEASUREMENT_ID=
      - GA4_API_SECRET=
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
volumes:
  redis_data:

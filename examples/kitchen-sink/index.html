<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsentGuard Kitchen Sink Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 24px; }
        .log-entry { font-family: monospace; font-size: 12px; padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; }
    </style>

    <!-- ConsentGuard Config -->
    <script>
        window.__consentGuardConfig = {
            proxyUrl: 'http://localhost:3000',
            proxySecret: 'dev-proxy-secret'
        };
    </script>

    <!-- MOCK: ConsentGuard Client (Simplified) -->
    <script>
        // In a real app, you'd import '@consentguard/client'
        // This is a minimal mock of the interceptor for the demo
        const originalFetch = window.fetch;
        window.fetch = async (url, options) => {
            if (url.includes('google-analytics.com') || url.includes('mixpanel.com') || url.includes('tiktok.com')) {
                const destination = url.includes('google-analytics') ? 'ga4' : 
                                  url.includes('mixpanel') ? 'mixpanel' : 'tiktok';
                
                console.log(`[ConsentGuard Demo] Intercepting ${destination} request...`);
                
                return originalFetch(`http://localhost:3000/ingest/${destination}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer dev-proxy-secret`,
                        'X-Consent-UserId': 'demo-user-123',
                        'X-Original-Url': url
                    },
                    body: options.body || JSON.stringify({ event: 'demo_event', data: 'confidential' })
                });
            }
            return originalFetch(url, options);
        };
    </script>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">ConsentGuard <span class="text-blue-500">Sandbox</span></h1>
                <p class="text-gray-400 mt-2">Test your privacy enforcement in real-time.</p>
            </div>
            <div class="flex gap-4">
                <span id="status-badge" class="bg-green-500/10 text-green-500 px-3 py-1 rounded-full text-sm font-medium border border-green-500/20">Proxy Online</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Consent Control -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    🛡️ Consent Settings
                </h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center p-4 bg-black/50 rounded-lg border border-gray-800">
                        <span>Analytics (GA4, Mixpanel)</span>
                        <input type="checkbox" id="consent-analytics" class="w-5 h-5 accent-blue-500">
                    </div>
                    <div class="flex justify-between items-center p-4 bg-black/50 rounded-lg border border-gray-800">
                        <span>Marketing (TikTok)</span>
                        <input type="checkbox" id="consent-marketing" class="w-5 h-5 accent-blue-500">
                    </div>
                </div>
                <button onclick="updateConsent()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                    Update Preferences
                </button>
            </div>

            <!-- Event Trigger -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    🚀 Trigger Events
                </h2>
                <p class="text-gray-400 mb-6 text-sm">Click these to simulate tracking calls from various SDKs.</p>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="trackEvent('ga4')" class="p-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-700 text-sm">
                        Google Analytics
                    </button>
                    <button onclick="trackEvent('mixpanel')" class="p-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-700 text-sm">
                        Mixpanel
                    </button>
                    <button onclick="trackEvent('tiktok')" class="p-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-700 text-sm">
                        TikTok Pixel
                    </button>
                    <button onclick="trackEvent('unknown')" class="p-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-700 text-sm">
                        Unknown SDK
                    </button>
                </div>
            </div>

            <!-- Console -->
            <div class="card md:col-span-2">
                <h2 class="text-xl font-semibold mb-4">Network Activity Log</h2>
                <div id="console" class="bg-black p-4 rounded-lg border border-gray-800 h-48 overflow-y-auto space-y-1">
                    <div class="text-gray-500 italic">Waiting for events...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const con = document.getElementById('console');
            const colors = { info: 'text-blue-400', success: 'text-green-400', error: 'text-red-400', warn: 'text-yellow-400' };
            const div = document.createElement('div');
            div.className = `log-entry ${colors[type]}`;
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            con.prepend(div);
        }

        async function updateConsent() {
            const analytics = document.getElementById('consent-analytics').checked;
            const marketing = document.getElementById('consent-marketing').checked;
            
            log(`Updating consent: analytics=${analytics}, marketing=${marketing}...`);
            
            try {
                const res = await fetch('http://localhost:3000/consent/demo-user-123', {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer dev-admin-secret'
                    },
                    body: JSON.stringify({
                        purposes: { analytics, marketing, necessary: true }
                    })
                });
                if (res.ok) log('Consent state saved to Redis!', 'success');
            } catch (e) {
                log('Failed to update consent. Is the proxy running?', 'error');
            }
        }

        function trackEvent(dest) {
            const urls = {
                ga4: 'https://www.google-analytics.com/g/collect',
                mixpanel: 'https://api.mixpanel.com/track',
                tiktok: 'https://graph.facebook.com/tiktok/events',
                unknown: 'https://api.tracker-x.com/v1/event'
            };
            
            log(`Triggering tracking call to ${dest}...`);
            fetch(urls[dest], {
                method: 'POST',
                body: JSON.stringify({ 
                    event: 'page_view', 
                    user: { email: 'user@example.com', ip: '1.2.3.4' } 
                })
            }).then(r => {
                if (r.status === 204) log(`✅ ${dest} request scrubbed/forwarded`, 'success');
                else if (r.status === 202) log(`⏳ ${dest} request buffered (pending consent)`, 'warn');
                else log(`❌ ${dest} request blocked`, 'error');
            }).catch(e => {
                log(`Failed to reach proxy: ${e.message}`, 'error');
            });
        }
    </script>
</body>
</html>

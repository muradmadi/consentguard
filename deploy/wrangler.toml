name = "consentguard-proxy"
main = "packages/server/src/runtime/workers.ts"
compatibility_date = "2024-05-15"

[vars]
# ADMIN_SECRET must be set via `wrangler secret put ADMIN_SECRET` in production.
CG_ALLOWED_ORIGINS = ""
BUFFER_PENDING = "true"

# Uncomment and populate to enable GA4 forwarding at the edge.
# GA4_MEASUREMENT_ID = ""
# GA4_API_SECRET = ""

# [[kv_namespaces]]
# binding = "CONSENT_STORE"
# id = "..."
